spec: "1.1"
devices:
  dmm:
    eom:
      USB INSTR:
        q: "\n"
        r: "\n"
    error:
      error_queue:
        - q: "SYST:ERR?"
          default: "0,\"No error\""
      command_error: "-100,\"Command error\""
      query_error: "-420,\"Query UNTERMINATED\""
    dialogues:
      - q: "*IDN?"
        r: "Keysight Technologies,34461A,MY57200001,A.02.14-02.40-02.14-00.49-02-01"
      - q: "*RST"
      - q: "*CLS"
      - q: "CONF:VOLT:DC 10,0.0001"
      - q: "TRIG:SOUR IMM"
      - q: "READ?"
        r: "+1.234567E+00"

resources:
  USB0::0x2A8D::0x1301::MY57200001::INSTR:
    device: dmm
